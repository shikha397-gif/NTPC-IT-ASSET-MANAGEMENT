<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Master Entry - IT Assets Management</title>
    <link rel="stylesheet" href="home.css">
    
    <!-- वन-पेज नॉन-स्क्रॉलिंग व्यूपोर्ट लॉक्ड फ़्रेमवर्क की विशेष CSS -->
    <style>
        html, body, .app-wrap {
            margin: 0; padding: 0; height: 100vh; overflow: hidden; box-sizing: border-box;
        }
        .main-container { display: flex; height: calc(100vh - 60px); width: 100%; }
        .submaster-panel {
            flex: 1; padding: 15px 20px; overflow: hidden; display: flex; flex-direction: column;
            background-color: #0d1b2a; box-sizing: border-box;
        }

        /* [CRITICAL HEIGHT FIX]: फ़ॉर्म को स्क्रीन पर बिना स्क्रॉल फिट करने की कस्टमाइज्ड हाइट */
        .master-form-wrapper {
            background-color: #0b132b; border: 1px solid #1c2541; border-radius: 6px;
            padding: 15px 25px; flex: 1; display: flex; flex-direction: column;
            justify-content: center; box-sizing: border-box; max-width: 520px; margin: 0 auto; width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); overflow: hidden;
        }
        .form-title-segment {
            font-size: 1.1rem; font-weight: bold; color: #00b4d8; margin-bottom: 12px;
            border-bottom: 1px solid #1c2541; padding-bottom: 6px;
        }
        .form-group-block { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .form-group-block label { font-size: 0.78rem; color: #a0aec0; font-weight: bold; letter-spacing: 0.5px; }
        
        .input-control-blue {
            width: 100%; padding: 8px 12px; background-color: #1c2541; border: 1px solid #0077b6;
            border-radius: 4px; color: #ffffff; font-size: 0.85rem; outline: none; box-sizing: border-box;
        }
        .input-control-blue:focus { border-color: #00b4d8; box-shadow: 0 0 4px rgba(0, 180, 216, 0.4); }
        
        .btn-master-submit {
            width: 100%; background-color: #ff5722; color: #ffffff; border: none; padding: 11px;
            font-size: 0.9rem; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 5px;
            transition: background-color 0.2s;
        }
        .btn-master-submit:hover { background-color: #ff7043; }
        .back-btn-row { text-align: center; margin-top: 10px; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="app-wrap">
        <header class="top-header">
            <div class="header-title">Dashboard of IT Assets Management</div>
            <div class="header-buttons">
                <button id="headerBtnHelp" class="btn btn-secondary">Help</button>
                <button id="headerBtnSettings" class="btn btn-secondary">Settings</button>
                <button id="headerBtnLogin" class="btn btn-primary">Login</button>
            </div>
        </header>
        <div class="main-container">
            <aside class="sidebar">
                <div class="logo-container">
                    <img src="ntpc logo.png" alt="NTPC Logo" class="sidebar-logo">
                </div>
                <nav class="nav-menu">
                    <a href="home.html" id="nav-home" class="nav-item">Home</a>
                    <a href="userarea.html" id="nav-userarea" class="nav-item">User Area</a>
                    <a href="reports.html" id="nav-reports" class="nav-item">Reports</a>
                    <a href="master.html" id="nav-master" class="nav-item active">Master</a>
                    <a href="transactions.html" id="nav-transactions" class="nav-item">Transactions</a>
                    <a href="special_access.html" id="nav-special" class="nav-item">Special Access</a>
                    <a href="#" id="nav-logout" class="nav-item logout">Logout</a>
                </nav>
            </aside>
            <!-- Main Workspace Canvas (Viewport Locked & Non-Scrollable) -->
            <main class="submaster-panel">
                
                <!-- Section Headings -->
                <div style="flex-shrink: 0; margin-bottom: 10px; text-align: center;">
                    <h2 style="color: #ffffff; font-size: 1.5rem; margin: 0;">MASTER MANAGEMENT</h2>
                    <h3 style="color: #00b4d8; font-size: 0.95rem; margin: 2px 0 0 0; font-weight: bold; letter-spacing: 0.5px;">EMPLOYEE REGISTRY PANEL</h3>
                </div>

                <!-- Main Employee Master Entry Form Wrapper Box Container -->
                <div class="master-form-wrapper">
                    <div class="form-title-segment">📝 New Employee Resource Registration</div>
                    
                    <form id="empMasterForm">
                        
                        <!-- Input 1: Employee ID / Ticket No -->
                        <div class="form-group-block">
                            <label>EMPLOYEE ID / TICKET NO.</label>
                            <input type="text" id="empTicketId" class="input-control-blue" placeholder="e.g. 100456" required>
                        </div>

                        <!-- Input 2: Employee Name -->
                        <div class="form-group-block">
                            <label>EMPLOYEE FULL NAME</label>
                            <input type="text" id="empFullName" class="input-control-blue" placeholder="e.g. Rahul Verma" required>
                        </div>

                        <!-- Input 3: Department Dropdown -->
                        <div class="form-group-block">
                            <label>DEPARTMENT / DIVISION</label>
                            <select id="empDept" class="input-control-blue" required>
                                <option value="">-- Select Department --</option>
                                <option value="C&I Maintenance">C&I (Control & Instrumentation)</option>
                                <option value="Operation Department">Operation Department</option>
                                <option value="Human Resources (HR)">Human Resources (HR)</option>
                                <option value="Information Technology (IT)">Information Technology (IT)</option>
                                <option value="Electrical Maintenance">Electrical Maintenance</option>
                                <option value="Finance & Accounts">Finance & Accounts</option>
                            </select>
                        </div>

                        <!-- Input 4: Designation / Post -->
                        <div class="form-group-block">
                            <label>OFFICIAL DESIGNATION</label>
                            <input type="text" id="empDesignation" class="input-control-blue" placeholder="e.g. Executive Engineer / Manager" required>
                        </div>

                        <!-- Input 5: NTPC Employee Grade / Level -->
                        <div class="form-group-block">
                            <label>EMPLOYEE GRADE LEVEL</label>
                            <select id="empGrade" class="input-control-blue" required>
                                <option value="">-- Select Grade --</option>
                                <option value="E1">E1 - Assistant Manager / Engineer</option>
                                <option value="E2">E2 - Deputy Manager</option>
                                <option value="E3">E3 - Manager</option>
                                <option value="E4">E4 - Senior Manager</option>
                                <option value="E5">E5 - Deputy General Manager (DGM)</option>
                            </select>
                        </div>

                        <!-- Input 6: Official Mobile Number -->
                        <div class="form-group-block">
                            <label>COMMUNICATION MOBILE NO.</label>
                            <input type="tel" id="empMobile" class="input-control-blue" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                        </div>

                        <!-- Full Width Orange Submit Button -->
                        <button type="submit" class="btn-master-submit">COMMIT TO MASTER DATABASE</button>
                    </form>
                </div>
                <!-- Footer Navigation Back Row Button -->
                <div class="back-btn-row">
                    <a href="master.html" class="btn-submaster-back" style="display: inline-block; background-color: #1c2541; color: #ffffff; text-decoration: none; padding: 10px 24px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; border: 1px solid #1c2541; cursor: pointer;">Back to Registry</a>
                </div>

            </main>
        </div>
    </div>

    <!-- फ़ॉर्म डेटा सीधे SQL डेटाबेस में जमा करने का जावास्क्रिप्ट कोर इंजन -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const masterForm = document.getElementById('empMasterForm');
            
            if (masterForm) {
                masterForm.addEventListener('submit', function(e) {
                    e.preventDefault(); // फॉर्म सबमिट होने पर पेज को रीलोड होने से रोकें

                    // सभी 6 इनपुट फ़ील्ड्स से डेटा कलेक्ट करना
                    const payload = {
                        empId: document.getElementById('empTicketId').value,
                        empName: document.getElementById('empFullName').value,
                        department: document.getElementById('empDept').value,
                        designation: document.getElementById('empDesignation').value,
                        grade: document.getElementById('empGrade').value,
                        mobile: document.getElementById('empMobile').value
                    };

                    // नोड जेएस के मास्टर एम्प्लोयी सबमिशन API को कॉल करना
                    fetch('/api/master/employee-submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(response => {
                        return response.json().then(data => {
                            if (!response.ok) {
                                throw new Error(data.message || 'Server connection error');
                            }
                            return data;
                        });
                    })
                    .then(res => {
                        if (res.success) {
                            // सफलता का संदेश दिखाना
                            alert(res.message);
                            masterForm.reset(); // फॉर्म को वापस खाली (Clear) कर देना
                        }
                    })
                    .catch(err => {
                        console.error('Error submitting form:', err);
                        alert('❌ ' + err.message);
                    });
                });
            }
        });
    </script>
</body>
</html>
