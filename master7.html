<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Master (E) - IT Assets Management</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <!-- Main Application Layout Container -->
    <div class="app-wrap">
        
        <!-- Top Branding Header Navigation Banner -->
        <header class="app-branding-header">
            <h1>IT ASSETS MANAGEMENT</h1>
            <!-- Horizontal Quick Access Navbar Links Matrix -->
            <nav class="horizontal-navbar">
                <a href="home.html">Home</a>
                <a href="userarea.html">User Area</a>
                <a href="reports.html">Reports</a>
                <a href="master.html" class="active">Master</a>
                <a href="transactions.html">Transactions</a>
                <a href="special_access.html">Special Access</a>
                <a href="#" class="logout-link">Logout</a>
            </nav>
        </header>

        <!-- Sidebar + Core Workspace Inner Layout Section -->
        <div class="main-container">
            
            <!-- Left Side Control Sidebar Menu Drawer -->
            <aside class="sidebar">
                <div class="menu-title">Menu</div>
                <nav class="nav-menu">
                    <a href="home.html" id="nav-home" class="nav-item">🏠 Home</a>
                    <a href="userarea.html" id="nav-userarea" class="nav-item">👤 User Area</a>
                    <a href="reports.html" id="nav-reports" class="nav-item">📊 Reports</a>
                    <a href="master.html" id="nav-master" class="nav-item active">🛠️ Master</a>
                    <a href="transactions.html" id="nav-transactions" class="nav-item">🔄 Transactions</a>
                    <a href="special_access.html" id="nav-special" class="nav-item">🔑 Special Access</a>
                    <a href="#" id="nav-logout" class="nav-item logout">🔓 Logout</a>
                </nav>
            </aside>

            <!-- Main Workspace Gray Canvas (Viewport Locked & Non-Scrollable) -->
            <main class="submaster-panel">
                
                <!-- Section Headings -->
                <div class="submaster-titles-row">
                    <h2 class="txt-master-main">MASTER</h2>
                    <h3 class="txt-submaster-accent">VENDOR MAST (E)</h3>
                </div>

                <!-- Form Control Card Block -->
                <div class="submaster-form-card">
                    <form id="vendorMasterForm7" class="grid-form-body">
                        
                        <!-- Row 1: 3 Input Columns (Vendor ID, Vendor Name, Contact) -->
                        <div class="form-row-three">
                            <div class="form-group-block">
                                <label for="vendorId">Vendor ID</label>
                                <input type="text" id="vendorId" class="input-control-blue" required autocomplete="off">
                            </div>
                            <div class="form-group-block">
                                <label for="vendorName">Vendor Name</label>
                                <input type="text" id="vendorName" class="input-control-blue" required autocomplete="off">
                            </div>
                            <div class="form-group-block">
                                <label for="vendorContact">Contact</label>
                                <input type="text" id="vendorContact" class="input-control-blue" required autocomplete="off">
                            </div>
                        </div>

                        <!-- Row 2: Status Dropdown + Aligned Submit Row Element -->
                        <div class="form-row-three align-bottom-row">
                            <div class="form-group-block">
                                <label for="vendorStatus">Status</label>
                                <select id="vendorStatus" class="input-control-blue" required>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <div class="form-group-block button-cell-stretch span-two-columns">
                                <button type="submit" class="btn-submit-green">Submit</button>
                            </div>
                        </div>

                    </form>
                </div>

                <!-- Vendor Records Data Header Label -->
                <div class="records-header-label">Vendor Records</div>
                
                <!-- Dynamic Table Grid Matrix Frame -->
                <div class="submaster-table-frame">
                    <table class="records-data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <!-- Target ID for dynamic javascript table management -->
                        <tbody id="vendorTableBody">
                            <!-- Dynamic records loaded from SQL server will generate here -->
                        </tbody>
                    </table>
                </div>

                <!-- Footer Navigation Back Row Button -->
                <div class="back-btn-row">
                    <a href="master.html" class="btn-submaster-back"> Back</a>
                </div>

            </main>
        </div>
    </div>

    <!-- Ensure home.js handles form submit events and loads data into #vendorTableBody -->
    <script src="home.js"></script>
</body>
</html>
