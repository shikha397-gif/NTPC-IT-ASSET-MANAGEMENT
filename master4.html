<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Master (E) - IT Assets Management</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <!-- Main Full-Screen Layout Wrapper System -->
    <div class="app-wrap full-viewport-height">
        
        <!-- Sidebar + Core Workspace Inner Panel Layout Section (No Upper Navbar Header) -->
        <div class="main-container headerless-layout">
            
            <!-- Left Side Control Sidebar Menu Drawer -->
            <aside class="sidebar">
                <div class="menu-title">Menu</div>
                <nav class="nav-menu">
                    <a href="home.html" id="nav-home" class="nav-item">🏠 Home</a>
                    <a href="userarea.html" id="nav-userarea" class="nav-item">👤 User Area</a>
                    <a href="reports.html" id="nav-reports" class="nav-item">📊 Reports</a>
                    <a href="master.html" id="nav-master" class="nav-item active">🛠️ Master</a>
                    <a href="transactions.html" id="nav-transactions" class="nav-item">🔄 Transactions</a>
                    <a href="special_access.html" id="nav-special" class="nav-item">🔑 Special Access</a>
                    <a href="#" id="nav-logout" class="nav-item logout">🔓 Logout</a>
                </nav>
            </aside>

            <!-- Main Workspace Gray Canvas (Viewport Locked & Non-Scrollable) -->
            <main class="submaster-panel">
                
                <!-- Section Headings -->
                <div class="submaster-titles-row">
                    <h2 class="txt-master-main">MASTER</h2>
                    <h3 class="txt-submaster-accent">VENDOR MAST (E)</h3>
                </div>

                <!-- Form Control Card Card Block -->
                <div class="submaster-form-card">
                    <form id="vendorMasterForm" class="grid-form-body">
                        
                        <!-- Row 1: 3 Input Columns (Vendor ID, Vendor Name, Contact) -->
                        <div class="form-row-three">
                            <div class="form-group-block">
                                <label>Vendor ID</label>
                                <input type="text" id="vendorIdInput" class="input-control-blue" required autocomplete="off">
                            </div>
                            <div class="form-group-block">
                                <label>Vendor Name</label>
                                <input type="text" id="vendorNameInput" class="input-control-blue" required autocomplete="off">
                            </div>
                            <div class="form-group-block">
                                <label>Contact</label>
                                <input type="text" id="vendorContactInput" class="input-control-blue" required autocomplete="off">
                            </div>
                        </div>

                        <!-- Row 2: Status Dropdown + Aligned Submit Row Element -->
                        <div class="form-row-three align-bottom-row">
                            <div class="form-group-block">
                                <label>Status</label>
                                <select id="vendorStatusInput" class="input-control-blue" required>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <div class="form-group-block button-cell-stretch span-two-columns">
                                <button type="submit" class="btn-submit-green">Submit</button>
                            </div>
                        </div>

                    </form>
                </div>

                <!-- Vendor Ledger Data Records Header Label -->
                <div class="records-header-label">Vendor Records</div>
                
                <!-- Table Frame with a completely empty body -->
                <div class="submaster-table-frame">
                    <table class="records-data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="vendorBackendTableBody">
                            <!-- Populated dynamically from Microsoft SQL Server -->
                        </tbody>
                    </table>
                </div>

                <!-- Footer Navigation Back Row Button -->
                <div class="back-btn-row">
                    <a href="master.html" class="btn-submaster-back"> Back</a>
                </div>

            </main>
        </div>
    </div>

    <!-- Live Microsoft SQL Server Data Pipeline Script -->
    <script>
    // 1. EVENT LISTENER: Intercepts form submission and saves to SQL Server via Node backend
    document.getElementById('vendorMasterForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 

        // Gathers values matching your precise HTML id selectors
        const vendorData = {
            Vendor_ID: document.getElementById('vendorIdInput').value,
            Vendor_Name: document.getElementById('vendorNameInput').value,
            Contact: document.getElementById('vendorContactInput').value,
            Status_Flag: document.getElementById('vendorStatusInput').value
        };

        try {
            const response = await fetch('http://localhost:5000/api/vendors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(vendorData)
            });

            if (response.ok) {
                alert('🎉 Vendor entry recorded to Microsoft SQL Server successfully!');
                document.getElementById('vendorMasterForm').reset(); // Clear all inputs
                loadVendorTable(); // Instantly update the table records below
            } else {
                const errMsg = await response.text();
                alert('❌ Server Data Rejection Error: ' + errMsg);
            }
        } catch (error) {
            console.error('Database routing failure:', error);
            alert('❌ Network connection to backend server failed.');
        }
    });

    // 2. ENGINE CONTROLLER: Pulls live vendor records from SQL Server and builds table rows
    async function loadVendorTable() {
        try {
            const response = await fetch('http://localhost:5000/api/vendors');
            const data = await response.json();
            
            const tableBody = document.getElementById('vendorBackendTableBody'); 
            if (!tableBody) return;
            
            tableBody.innerHTML = ''; // Wipe out any cached visual lines

            data.forEach(item => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${item.Vendor_ID}</td>
                        <td>${item.Vendor_Name}</td>
                        <td>${item.Contact}</td>
                        <td>${item.Status_Flag}</td>
                        <td class="action-cell">
                            <button class="btn-inline-action edit-btn">Edit</button>
                            <button class="btn-inline-action delete-btn">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Data compilation extraction failure:', error);
        }
    }

    // 3. SEED LOADER: Loads data instantly from the database upon interface access
    window.onload = loadVendorTable;
    </script>
</body>
</html>
